<!DOCTYPE html>
<html lang="de" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: gap: content:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob: content:; connect-src 'self'; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<meta name="format-detection" content="telephone=no">
<title>SneakPlay</title>
<style>
:root{
  --bg:#17122F; --bg2:#22194A; --card:#261F52; --card2:#1C1640; --line:#3A3270; --text:#F4F1FF; --muted:#ABA4D8;
  --acc:#FF5D8F; --acc2:#FF8A5D; --on-acc:#FFFFFF; --gold:#FFD25D; --on-gold:#2A1D00; --ok:#3DDC97; --on-ok:#06281A;
  --bad:#FF6B6B; --on-bad:#2B0606; --blue:#6EA8FF; --on-blue:#061A33; --glow:#3B2B86;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6);
  --gold-text:#FFD25D; --acc-soft:rgba(255,93,143,.25); --acc-soft2:#3A2150; --line-soft:rgba(255,255,255,.07); --tint:rgba(255,255,255,.08); --acc-tint:#33295F; --acc-line:#7A4FB0;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6F3FF; --bg2:#ECE6FF; --card:#FFFFFF; --card2:#F3EFFF; --line:#DDD5F5; --text:#1F1640; --muted:#655C8F;
    --acc:#E23D74; --acc2:#F2704A; --gold:#F5B400; --on-gold:#2A1D00; --ok:#139E66; --on-ok:#FFFFFF; --bad:#D63A3A; --on-bad:#FFFFFF;
    --blue:#2F6FDE; --on-blue:#FFFFFF; --glow:#DCD0FF; --shadow:0 8px 24px -14px rgba(40,20,90,.35);
    --gold-text:#9A6200; --acc-soft:rgba(226,61,116,.22); --acc-soft2:#FCE4EE; --line-soft:rgba(31,22,64,.08); --tint:rgba(31,22,64,.06); --acc-tint:#F6E7F3; --acc-line:#E7A6C8;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
    --bg:#F6F3FF; --bg2:#ECE6FF; --card:#FFFFFF; --card2:#F3EFFF; --line:#DDD5F5; --text:#1F1640; --muted:#655C8F;
    --acc:#E23D74; --acc2:#F2704A; --gold:#F5B400; --on-gold:#2A1D00; --ok:#139E66; --on-ok:#FFFFFF; --bad:#D63A3A; --on-bad:#FFFFFF;
    --blue:#2F6FDE; --on-blue:#FFFFFF; --glow:#DCD0FF; --shadow:0 8px 24px -14px rgba(40,20,90,.35);
    --gold-text:#9A6200; --acc-soft:rgba(226,61,116,.22); --acc-soft2:#FCE4EE; --line-soft:rgba(31,22,64,.08); --tint:rgba(31,22,64,.06); --acc-tint:#F6E7F3; --acc-line:#E7A6C8;
    color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(1100px 560px at 50% -220px,var(--glow) 0%,transparent 62%),var(--bg);overscroll-behavior:none}
button,input,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#view{overflow-wrap:anywhere;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px)}
h1,h2,h3{margin:0;line-height:1.2}
p{line-height:1.45}
a{color:var(--acc)}
.muted{color:var(--muted)} .small{font-size:14px} .center{text-align:center}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card>h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pill{background:var(--line);color:var(--muted);border-radius:99px;padding:2px 9px;font-size:13px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
input[type=text],textarea{flex:1;min-width:0;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:140px;resize:vertical;line-height:1.4}
.btn{appearance:none;border:1.5px solid var(--line);background:var(--card2);border-radius:16px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .08s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:var(--on-acc);box-shadow:0 8px 20px -8px var(--acc)}
.btn.primary:disabled{box-shadow:none}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.big{display:flex;width:100%;font-size:19px;padding:16px;margin:6px 0 10px}
.btn.wide{width:100%}
.btn.add{padding:0 18px;font-size:24px;line-height:1}
.link{background:none;border:0;color:var(--muted);font-size:15px;font-weight:600;text-decoration:underline;padding:10px;display:block;margin:2px auto;cursor:pointer}
.err{color:var(--gold);text-align:center;font-weight:700;font-size:14px;margin:6px 0 0;min-height:1em}
.err:empty{display:none}
/* Startseite */
.homebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hbtns{display:flex;gap:6px}
.btnrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.btnrow .btn{min-width:0;padding-left:8px;padding-right:8px}
.lang{display:flex;gap:6px}
.langbtn,.iconbtn{background:var(--card);border:1.5px solid var(--line);border-radius:99px;min-width:44px;height:44px;font-size:20px;cursor:pointer;padding:0 10px}
.langbtn[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.hero{text-align:center;margin:4px 0 18px}
.hero img{border-radius:18px;box-shadow:var(--shadow)}
.hero h1{font-size:32px;margin-top:8px;letter-spacing:.3px}
.hero p{margin:4px 0 0;color:var(--muted)}
.worldsw{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin:0 0 14px;gap:4px}
.worldsw button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font-size:16px;font-weight:800;padding:10px 6px;border-radius:12px;cursor:pointer;min-height:46px}
.worldsw button[aria-checked=true]{background:var(--acc);color:var(--on-acc)}
.worldsw button:disabled{opacity:.35;cursor:default}
.worldpick .wbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;cursor:pointer;color:var(--text)}
.worldpick .wbtn>span:first-child{font-size:30px;flex:none}
.worldpick .wbtn>span:last-child{min-width:0}
.worldpick .wbtn b{display:block;font-size:18px}.worldpick .wbtn small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px}
.plist{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.plist li{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 10px}
.seat{width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--muted);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.pn{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;text-align:left;font-size:16px;padding:8px 2px;cursor:pointer}
.mini{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);font-size:16px;cursor:pointer;flex:none}
.mini:disabled{opacity:.25;cursor:default}
.modes{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.moderow{display:flex;gap:6px;align-items:stretch}.moderow .mode{flex:1;min-width:0}
.qbtn{flex:none;width:44px;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--muted);font-size:19px;font-weight:800;cursor:pointer}
.linkrow{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px}.linkrow .link{margin:2px 0}
.mode{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;width:100%}
.mode .mi{font-size:28px;flex:none}
.mode b{display:block;font-size:17px}
.mode small{color:var(--muted);font-size:13px;line-height:1.3;display:block;margin-top:2px}
.mode[aria-checked=true]{border-color:var(--acc);background:var(--acc-soft2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:99px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer}
.chip[aria-checked=true]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.chip.new{border-style:dashed;color:var(--muted)}
.chip.static{cursor:default}
.sel{width:100%;margin-top:8px;background:var(--bg);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.chip .ed{margin-left:6px;opacity:.7}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line-soft)}
.opt:first-of-type{border-top:0;padding-top:2px}
.opt.col{flex-direction:column;align-items:stretch}
.lbl b{display:block}.lbl small{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;border:1px solid var(--line);flex:none}
.seg button{border:0;background:none;color:var(--muted);font-size:14px;font-weight:700;padding:8px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;flex:1;min-height:38px}
.opt.col .seg{max-width:100%}
.opt.col .seg button{white-space:normal;line-height:1.2;min-width:0}
.seg button[aria-checked=true]{background:var(--acc);color:var(--on-acc)}
.seg button:disabled{opacity:.3;cursor:default}
.switch{width:54px;height:32px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;padding:0}
.switch .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked=true]{background:var(--ok)}.switch[aria-checked=true] .knob{left:25px}
.switch:disabled{opacity:.35;cursor:default}
table.score{width:100%;border-collapse:collapse;table-layout:fixed}
.score td{padding:8px 4px;border-top:1px solid var(--line-soft);font-weight:700}
.score tr:first-child td{border-top:0}
.score td.r{width:4.2em;text-align:right;font-size:18px;font-variant-numeric:tabular-nums}
.score .d{color:var(--ok);font-size:13px;margin-left:6px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
.foot p{margin:6px 0}
/* Runde */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.tag{background:var(--tint);border-radius:99px;padding:7px 12px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{background:var(--tint);border:0;color:var(--muted);border-radius:99px;padding:0 14px;min-height:40px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.step{color:var(--muted);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1.4px}
.passto{font-size:20px;font-weight:700;margin-top:6px}
.who{font-size:clamp(30px,10vw,42px);font-weight:800;margin:2px 0 14px;color:var(--gold-text);word-break:break-word}
.hold{position:relative;height:min(52vh,360px);min-height:170px;border-radius:24px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer;margin-bottom:14px}
.hold .cover,.hold .secret{position:absolute;inset:0;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.cover{background:repeating-linear-gradient(45deg,var(--acc-tint) 0 14px,var(--card) 14px 28px);border:2px dashed var(--acc-line)}
.cover .fp{font-size:56px;animation:pulse 1.6s infinite}
.cover p{font-weight:800;font-size:18px;margin:10px 0 0}
.secret{visibility:hidden;background:linear-gradient(160deg,var(--card),var(--card2));border:2px solid var(--acc);overflow:auto}
.hold.show .secret{visibility:visible}
.fitwrap{width:100%;display:flex;flex-direction:column;align-items:center}.hold.show .cover{visibility:hidden}
.k{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:800}
.w{font-size:clamp(26px,8.5vw,36px);font-weight:800;margin:6px 0 10px;line-height:1.12;word-break:break-word}
.w.imp{color:var(--bad)} .w.clue{color:var(--blue)} .w.num{font-variant-numeric:tabular-nums;letter-spacing:.5px}
.m{font-size:19px;font-weight:700;line-height:1.35;margin:6px 0}
.m.gold{color:var(--gold-text)}
.hold.compact .cover .fp{font-size:40px}.hold.compact .cover p{font-size:16px;margin-top:6px}
.hold.compact .secret{padding:10px 12px}.hold.compact .w{font-size:24px;margin:2px 0 6px}.hold.compact .m{font-size:15px;line-height:1.28;margin:2px 0}.hold.compact .k{font-size:11px;margin-top:4px!important}.hold.compact small{font-size:12px;line-height:1.3}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.pop{animation:pop .3s ease-out}
.order{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.order span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-weight:700;font-size:14px}
.order span:first-child{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.big-h{font-size:28px;font-weight:800;margin:6px 0}
.e-big{font-size:56px;line-height:1}
.topic{font-size:24px;font-weight:800;line-height:1.25;margin:8px 0;color:var(--gold-text)}
.timer .tval{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.tbar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--gold),var(--acc));transition:width .2s linear}
.timer.done .tval{color:var(--bad)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:14px 0}
.pbtn{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 8px;font-size:17px;font-weight:800;cursor:pointer;word-break:break-word;min-height:58px}
.pbtn[aria-checked=true]{border-color:var(--acc);background:var(--acc-soft2)}
.reveal-word{font-size:clamp(28px,9vw,38px);font-weight:800;color:var(--gold-text);margin:4px 0;word-break:break-word}
.judge{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.judge:first-of-type{border-top:0}
.judge .nm{font-weight:800;min-width:0}
.jb{display:flex;gap:6px;flex-wrap:wrap}
.jb button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 11px;font-size:14px;font-weight:700;cursor:pointer;min-height:42px}
.jb button[aria-checked=true].ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.jb button[aria-checked=true].bad{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.jb button[aria-checked=true].mid{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.mcard{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.mcard .mt{font-weight:700;margin:8px 0 10px;line-height:1.35;color:var(--gold-text)}
.award{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border-radius:16px;margin-top:10px;border:1px solid var(--line);animation:pop .4s ease-out both}
.award .e{font-size:34px;flex:none}
.award>div:last-child{min-width:0}
.award b{display:block;font-size:17px}
.award .n{color:var(--gold-text);font-weight:800}
.award small{color:var(--muted);display:block}
.bomb{font-size:110px;line-height:1;margin:18px 0 8px;display:inline-block}
.bomb.live{animation:shake .35s infinite}
@keyframes shake{25%{transform:rotate(-6deg) scale(1.04)}75%{transform:rotate(6deg) scale(1.04)}}
.boom{animation:boom .5s ease-out}
@keyframes boom{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.flash{animation:flash .6s ease-out}
@keyframes flash{0%{background:var(--bad)}100%{background:transparent}}
.rules h2{font-size:19px;margin-bottom:8px}
.rules ol,.rules ul{padding-left:20px;margin:0}
.rules li{line-height:1.5;margin:3px 0}
.rules .score-note{color:var(--muted);font-size:14px}
/* Gruppen, Teams, Erklär-Modus */
.grp{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:14px 0 8px}
.grp:first-of-type{margin-top:0}
.badge{display:inline-block;margin-top:8px;background:var(--acc-soft2);color:var(--text);border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px}
.tdot{display:inline-block;width:14px;height:14px;border-radius:50%;margin:0 6px 0 2px;vertical-align:-1px;flex:none}
.tscore{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 14px}
.tscore span{max-width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:700;font-size:15px}
.tscore span.cur{border-color:var(--acc)}
.steps{margin:0;padding-left:20px}.steps li{margin:4px 0;line-height:1.45}
.tbar.big{height:12px;margin:0 0 4px}
.excard{background:linear-gradient(160deg,var(--card),var(--card2));border:2px solid var(--acc);border-radius:24px;padding:14px;text-align:center;margin:8px 0 12px}
.excard .w{margin:6px 0 8px}
.forbid{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.forbid li{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:800;font-size:17px;color:var(--bad);word-break:break-word}
.exbtns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.exbtns .exok{grid-column:1 / -1;background:var(--ok);border-color:var(--ok);color:var(--on-ok);font-size:20px;min-height:60px}
.exbtns .extaboo{color:var(--bad);border-color:var(--bad);min-height:54px}
.exbtns .exskip{min-height:54px}
.coach{background:var(--acc-soft2);border:1.5px dashed var(--acc-line);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;margin:0 0 12px;font-weight:600}
/* Vollversion */
.mbadge{font-style:normal;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;background:var(--line);color:var(--muted);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.mbadge.free{background:var(--ok);color:var(--on-ok)}
.notice{background:var(--acc-soft2);border:1px solid var(--acc-line);border-radius:14px;padding:12px 14px;font-weight:600;line-height:1.45}
.center-block{display:block;text-align:center;margin:0 auto 14px;width:max-content;max-width:100%}
.prolist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.prolist li{line-height:1.4}
.facts{list-style:none;padding:0;margin:0 0 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;font-weight:600}
/* QR teilen und scannen */
.qrbox{background:#fff;border-radius:18px;padding:8px;display:block;width:100%;max-width:440px;margin:0 auto}
.qrbox canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.scanner{display:flex;flex-direction:column;gap:12px;align-items:center}
.scanframe{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:20px;overflow:hidden}
.scanframe[hidden]{display:none}
.scanvideo{width:100%;height:100%;object-fit:cover}
.scanbox{position:absolute;inset:16%;border:4px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.msg{font-weight:700;text-align:center;margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Dialog und Hinweis */
.dlg{position:fixed;inset:0;background:rgba(10,6,25,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.dlg[hidden]{display:none}
.dlg-box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.dlg-box h3{font-size:19px;margin-bottom:8px}
.dlg-box .row{justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:15px;z-index:30;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<main id="view" class="view"></main>
<div id="dlg" class="dlg" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/content.js"></script>
<script src="js/decks.js"></script>
<script src="js/game.js"></script>
<script src="js/qr.js"></script>
<script src="js/jsqr.js"></script>
<script src="js/shop.js"></script>
<script src="js/app.js"></script>
<script src="cordova.js"></script>
</body>
</html>
